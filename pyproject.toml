[project]
name = "easy-auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Best", email = "benbest987@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
easy-auth = "easy_auth:main"
gen-keys = "easy_auth.scripts.gen_keys:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
