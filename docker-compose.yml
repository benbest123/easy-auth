services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: easy_auth
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: easy_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easy_auth -d easy_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

